<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="roomifyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1D4ED8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#roomifyGrad)" filter="url(#shadow)"/>
  <!-- Subtle inner border -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Modern Video Camera Icon -->
  <rect x="28" y="40" width="48" height="48" rx="12" fill="#FFFFFF"/>
  <path d="M80 52 L98 42 C100 40.8 102 42.2 102 44.5 L102 83.5 C102 85.8 100 87.2 98 86 L80 76 Z" fill="#FFFFFF"/>
  <!-- Camera lens dot / indicator -->
  <circle cx="52" cy="64" r="10" fill="url(#lensGrad)"/>
  <circle cx="55" cy="61" r="3" fill="#FFFFFF" opacity="0.8"/>
  <!-- Live spark indicator -->
  <circle cx="94" cy="30" r="5" fill="#10B981"/>
  <circle cx="94" cy="30" r="8" fill="#10B981" opacity="0.3"/>
</svg>
